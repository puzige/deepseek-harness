# Release — the only pipeline in this repository.
#
# Builds the DeepSeek Harness desktop client (apps/electron) for macOS,
# Windows, and Linux and publishes the artifacts to a GitHub Release, which
# also feeds electron-updater (latest*.yml is generated per platform).
#
# Trigger options:
#   • workflow_dispatch — manual: pick a version number and the draft state.
#   • push tag "v*"      — tag-driven: version comes from the tag.
#
# The version appears in the release title and the artifact names, so any
# number of versions can be published from the same pipeline.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.0). Empty uses the app package version.'
        required: false
        type: string
      draft:
        description: 'Create the release as a draft'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      draft: ${{ steps.resolve.outputs.draft }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: resolve
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./apps/electron/package.json').version")
          fi
          # Tag-driven releases are public; manual ones default to draft.
          DRAFT="${{ inputs.draft }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            DRAFT="false"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_name=DeepSeek Harness $VERSION" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per platform; each target builds every arch declared in
          # apps/electron/electron-builder.yml (mac x64+arm64, win x64+arm64,
          # linux x64+arm64). All runners use -latest: older macOS images are
          # retired and no pinned image is guaranteed to stay available.
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The electron main process resolves workspace packages through their
      # built lib/ output; the web profile serves the built frontend dist.
      - name: Build workspace libraries
        run: pnpm run build

      - name: Set app version
        working-directory: apps/electron
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ needs.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build desktop app
        working-directory: apps/electron
        run: pnpm run build

      - name: Package (${{ matrix.target }})
        working-directory: apps/electron
        run: pnpm run package:${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.target }}
          # Installer artifacts only — electron-builder also emits *-unpacked
          # build directories under release/ that must not reach the release.
          path: |
            apps/electron/release/*.dmg
            apps/electron/release/*.zip
            apps/electron/release/*.exe
            apps/electron/release/*.AppImage
            apps/electron/release/*.deb
            apps/electron/release/*.blockmap
            apps/electron/release/*.yml
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      # gh release --generate-notes derives the changelog from git history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ needs.version.outputs.release_name }}
          VERSION: ${{ needs.version.outputs.version }}
          DRAFT: ${{ needs.version.outputs.draft }}
        run: |
          gh release create "v${VERSION}" artifacts/* \
            --title "${RELEASE_NAME}" \
            --generate-notes \
            --draft="${DRAFT}" \
            --notes "Desktop client build ${VERSION} — see the changelog for what changed."
